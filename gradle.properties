# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache can conflict with some AGP/Hilt tasks; enable once stable
# org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9 built-in Kotlin: allow KSP/Hilt to register generated sources until tooling fully migrates
android.disallowKotlinSourceSets=false

# Stabilize Kotlin compilation when the compile daemon fails to connect on Windows
kotlin.compiler.execution.strategy=in-process
